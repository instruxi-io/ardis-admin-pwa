name: Deploy

# This repo had no pipeline: deploys were `npx wrangler pages deploy` from one
# person's laptop, so nothing tied what was live to what was on master, and
# nobody else could ship at all.
#
# Build-time values come from the GitHub Environment, not a committed file,
# because Vite bakes VITE_* in at build time.
# Settings -> Environments -> staging -> Variables.

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Test
        run: npm test -- --run
        # The same variables the build gets. src/config/env.ts throws on a
        # missing one, and a test that imports it therefore failed to load —
        # which failed the job, so this pipeline had never once deployed and
        # master sat behind what was live.
        env:
          VITE_ENFORCER_BASE_URL: ${{ vars.VITE_ENFORCER_BASE_URL }}
          VITE_ARDIS_MS_URL: ${{ vars.VITE_ARDIS_MS_URL }}
          VITE_APP_ENV: staging

      - name: Build
        run: npm run build
        env:
          VITE_ENFORCER_BASE_URL: ${{ vars.VITE_ENFORCER_BASE_URL }}
          VITE_ARDIS_MS_URL: ${{ vars.VITE_ARDIS_MS_URL }}
          VITE_APP_ENV: staging

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch matters: without it wrangler cannot infer the branch in CI,
          # so the deployment updated the bare project alias while the URL the
          # client actually uses, master.credpass-admin-portal-dev.pages.dev,
          # kept serving the previous build.
          # --commit-dirty: the build writes into the working tree, so wrangler
          # sees a dirty repo and, when it does, refuses to attach the branch
          # alias — the deployment lands on a hashed preview URL and
          # master.credpass-admin-portal-dev.pages.dev, the link the client
          # has, keeps serving whatever it served before.
          command: pages deploy dist --project-name=credpass-admin-portal-dev --branch=master

      # Cloudflare refreshes the project alias on every deploy, but the
      # master.<project> subdomain is a frozen artifact: it still serves a build
      # from before this pipeline existed, and two emails sent to the client
      # point at it. So a green deploy has been proving nothing about the URL
      # some people actually open.
      #
      # This fails the build when the canonical URL is not serving what we just
      # built, and reports whether the stale branch alias has caught up. Give
      # the client the canonical URL, not the branch one.
      - name: The live portal must serve what we just built
        run: |
          set -euo pipefail
          BUILT="$(basename "$(ls dist/assets/index-*.js | head -1)")"
          CANON="https://credpass-admin-portal-dev.pages.dev"
          BRANCH="https://master.credpass-admin-portal-dev.pages.dev"
          echo "built: $BUILT"
          for i in 1 2 3 4 5 6; do
            SERVED="$(curl -fsS "$CANON/?cb=$RANDOM" | grep -oE 'index-[A-Za-z0-9_-]+\.js' | head -1 || true)"
            [ "$SERVED" = "$BUILT" ] && break
            echo "  $CANON serving ${SERVED:-<none>}, waiting..."
            sleep 10
          done
          if [ "${SERVED:-}" != "$BUILT" ]; then
            echo "::error::$CANON is serving '${SERVED:-nothing}', not '$BUILT'."
            exit 1
          fi
          echo "$CANON is current"
          STALE="$(curl -fsS "$BRANCH/?cb=$RANDOM" | grep -oE 'index-[A-Za-z0-9_-]+\.js' | head -1 || true)"
          if [ "$STALE" != "$BUILT" ]; then
            echo "::warning::$BRANCH is serving '${STALE:-nothing}', not '$BUILT'. Anyone given that link sees an old portal; send them $CANON."
          fi --commit-dirty=true
